[project]
name = "duorestockbot"
version = "0.1.0"
description = "Monitor Apple Store iPhone Duo pickup availability (Nashville area) and notify via Telegram"
requires-python = ">=3.11"
dependencies = ["requests>=2.32", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
